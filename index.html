<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fix the Factory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--panel:#ffffff;--line:#dbe3ec;--ink:#17202b;--mute:#5d6b7c;
  --s1:#1f9d55;--s1t:#15803d;--s2:#1c7fd6;--s3:#f2b01e;--s3t:#a86f00;--red:#ef3f52}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#dfeefb;overflow:hidden;font-family:Kanit,"Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);user-select:none}
body,button,.src,.pin{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><path d='M4 3 L4 36 L13 28 L19 41 L25 38 L19 26 L31 26 Z' fill='white' stroke='black' stroke-width='2.5' stroke-linejoin='round'/></svg>") 4 3,auto}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:linear-gradient(180deg,#86c5f4 0%,#c4e4ff 48%,#eef7ff 100%)}
button{font-family:inherit;border:0;color:inherit;background:none}

/* top bar */
header{position:absolute;z-index:5;left:0;top:0;right:0;height:110px;display:flex;align-items:center;padding:0 48px;gap:24px}
.brand{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:800;letter-spacing:.5px}
.brand .dot{width:22px;height:22px;border-radius:50%;background:var(--s1);box-shadow:0 0 0 6px rgba(31,157,85,.22)}
.hud{margin-left:auto;display:flex;gap:16px}
.pill{font-size:34px;font-weight:600;padding:8px 26px;border-radius:999px;background:var(--panel);border:2px solid var(--line);display:flex;gap:12px;align-items:center;
  box-shadow:0 6px 18px rgba(20,45,80,.12);transition:box-shadow .3s,border-color .3s}
.pill b{font-weight:800}
#timePill.low{border-color:var(--red);color:var(--red);animation:pulse .5s infinite alternate}
#budgetPill b{color:var(--s3t)}
#doneBtn{display:none;color:var(--s1t);border-color:var(--s1)}
.play #doneBtn{display:flex}
#doneBtn:hover{background:var(--s1);color:#fff}
#lang{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;font-size:26px;font-weight:600;background:var(--panel);box-shadow:0 6px 18px rgba(20,45,80,.12)}
#lang span{padding:10px 22px;color:var(--mute)}
#lang span.on{background:var(--ink);color:#fff}
#mute{font-size:30px;width:64px;height:60px;border-radius:999px;border:2px solid var(--line);background:var(--panel);box-shadow:0 6px 18px rgba(20,45,80,.12)}

/* scene */
#scene{position:absolute;left:0;top:100px;width:1300px;height:970px}
#world{transform-origin:650px 470px;transition:transform 2.8s cubic-bezier(.65,0,.25,1)}
.zoom #world{transform:scale(.5) translateY(40px)}
#outer{opacity:0;transition:opacity 1.6s 1s}
.zoom #outer{opacity:1}
#o2,#o3{transition:opacity .5s}
[data-hl=s2] #o3,[data-hl=s3] #o2{opacity:.18}
#pins{transition:opacity .6s}
.zoom #pins{opacity:0}
.src{transition:filter .2s}
.play .src:hover{filter:brightness(1.1) drop-shadow(0 0 12px rgba(239,63,82,.85))}
.src.sel{filter:brightness(1.08) drop-shadow(0 0 5px #1c7fd6) drop-shadow(0 0 14px #1c7fd6)!important}
.src.fixed{filter:saturate(.6) drop-shadow(0 0 10px rgba(31,157,85,.95))}
.src.fixed .puff{display:none}
.puff{animation:puff 2.4s linear infinite;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.75}100%{transform:translate(18px,-120px) scale(1.6);opacity:0}}
.bub{animation:bub 1.8s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes bub{0%{transform:scale(.2);opacity:0}50%{opacity:1}100%{transform:scale(1.4) translateY(-6px);opacity:0}}
.src.fixed .bub{display:none}
.play .pin:hover{filter:brightness(1.1)}
.pin .tag{font-weight:800;font-size:26px}
.pinpulse{animation:pinp 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pinp{to{transform:scale(1.12)}}
[data-hl=pins] #pins{filter:drop-shadow(0 0 12px rgba(239,63,82,.9))}
[data-hl=pins] .pinpulse{animation-duration:.5s}
/* first-click hint: a calm white tag + soft ring, no bouncing */
#hand{display:none;pointer-events:none}
#hand.on{display:block;animation:fadein .6s ease-out}
@keyframes fadein{from{opacity:0}}
#hand .ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.3);opacity:0}}
.q{font-weight:800}
/* smoggy sky: painted behind the whole scene, so it never covers a machine */
#sky{position:absolute;inset:0;pointer-events:none;background:rgba(98,86,66,.5);transition:opacity 1.4s ease}
#sky::before{content:"";position:absolute;left:0;top:0;width:1300px;height:820px;background:radial-gradient(ellipse 640px 470px at 650px 260px,rgba(110,98,78,.8),rgba(96,86,68,.4) 55%,rgba(96,86,68,0) 100%)}
#sky i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(140,130,114,.92),rgba(122,112,98,.55) 55%,rgba(122,112,98,0));animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(50px)}}
#sun{opacity:0;transition:opacity 1.6s ease;pointer-events:none}
#sun.on{opacity:1}
#sun .rays{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.zoom #sky{opacity:0!important}
.zoom #sun{opacity:0}
.lockq{animation:pinp 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}

/* narrator: a character with a speech bubble (the bubble is the subtitle) */
#narr{position:absolute;z-index:4;left:34px;bottom:22px;width:128px;height:128px;border-radius:50%;overflow:hidden;background:#ffe7c2;
  box-shadow:0 0 0 6px #fff,0 0 0 11px var(--s1),0 12px 30px rgba(20,45,80,.3)}
.attract #narr{display:none}
#narr svg{display:block}
#narr.talk svg{animation:nod .45s ease-in-out infinite alternate}
@keyframes nod{to{transform:translateY(-3px) rotate(-2deg)}}
#narr .mouth{transform-box:fill-box;transform-origin:center}
#narr.talk .mouth{animation:talk .15s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(2.4)}}
#caption{position:absolute;left:186px;width:1074px;bottom:36px;padding:18px 30px;border-radius:28px;background:#fff;color:var(--ink);
  box-shadow:0 12px 32px rgba(20,45,80,.25);font-size:34px;line-height:1.3;font-weight:600;opacity:0;transform:translateY(16px);transition:.25s;pointer-events:none;z-index:4}
#caption::before{content:"";position:absolute;left:-32px;bottom:26px;border:14px solid transparent;border-right:18px solid #fff}
#caption.show{opacity:1;transform:none}

/* panel */
#panel{position:absolute;left:1316px;top:112px;width:570px;height:948px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border-radius:24px;padding:20px 26px;box-shadow:0 12px 32px rgba(20,45,80,.14);transition:box-shadow .3s}
.card.meter{padding:14px 26px;position:relative}
.meter .lbl{font-size:24px;color:var(--mute)}
.meter .num{font-size:64px;font-weight:800;line-height:1.05;color:var(--red);transition:color .3s}
.meter .num small{font-size:24px;color:var(--mute);font-weight:600;margin-left:8px}
.meter .num.good{color:var(--s1t)}
.bar{position:relative;height:24px;border-radius:12px;background:#e4ebf2;margin-top:8px}
.bar i{display:block;height:100%;width:100%;border-radius:12px;background:linear-gradient(90deg,var(--s1),var(--s3) 55%,var(--red));transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.goal{position:absolute;top:-8px;bottom:-8px;width:5px;background:var(--ink);border-radius:3px}
.meter .goalTxt{position:absolute;right:26px;top:66px;font-size:22px;font-weight:800;color:var(--s1t);border:2px solid var(--s1);border-radius:999px;padding:2px 14px}
[data-hl=budget] #budgetPill,[data-hl=budget] #timePill{border-color:var(--s3);box-shadow:0 0 0 4px rgba(242,176,30,.45),0 0 30px rgba(242,176,30,.6)}
[data-hl=meter] .card.meter{box-shadow:0 0 0 4px var(--s1),0 0 30px rgba(31,157,85,.45)}
/* Scope 2 / 3: locked teaser tiles (no answers in the game, staff take over) */
#teaser{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#teaser .tz{border-radius:20px;border:3px solid var(--c);padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;background:color-mix(in srgb,var(--c) 9%,#fff);transition:opacity .4s,box-shadow .4s}
#teaser .tz b{font-size:26px;color:var(--ct)}
#teaser .qm{font-size:86px;font-weight:800;line-height:1;color:var(--ct)}
#teaser .tz i{font-style:normal;font-size:20px;color:var(--mute)}
#teaser .hint{grid-column:1/-1;text-align:center;font-size:22px;color:var(--mute)}
.tease #teaser .tz{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 0 30px color-mix(in srgb,var(--c) 55%,transparent);animation:shake 2.4s ease-in-out infinite}
[data-hl=s2] #tz3,[data-hl=s3] #tz2{opacity:.3;animation:none!important;box-shadow:none!important}
@keyframes shake{0%,86%,100%{transform:none}89%{transform:translateX(-6px)}92%{transform:translateX(6px)}95%{transform:translateX(-4px)}}

#info{flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden}
#info h3{font-size:36px;font-weight:800;display:flex;gap:12px;align-items:center;line-height:1.15}
#info .desc{font-size:25px;color:var(--mute);line-height:1.3}
#info .emit{font-size:27px}
#info .emit b{color:var(--red);font-size:32px}
.how{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.how div{display:flex;gap:14px;align-items:center;font-size:25px;line-height:1.25;color:var(--mute);padding:8px 12px;border-radius:14px;border:2px solid transparent;transition:.3s}
.how div b{flex:none;width:42px;height:42px;border-radius:50%;background:#e4ebf2;display:grid;place-items:center;font-size:22px;color:var(--ink)}
.how div.on{color:var(--ink);border-color:var(--s1);background:rgba(31,157,85,.08)}
.how div.on b{background:var(--s1);color:#fff}
.fix{margin-top:auto;border-radius:18px;border:2px dashed var(--s1);padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:rgba(31,157,85,.04)}
.fix .t{font-size:27px;font-weight:600;color:var(--s1t);line-height:1.25}
.fix .stats{display:flex;gap:20px;font-size:27px}
.fix .stats .cut{color:var(--s1t);font-weight:800}
.fix .stats .cost{color:var(--s3t);font-weight:800}
.btn{font-size:32px;font-weight:800;padding:12px 22px;border-radius:16px;background:var(--s1);color:#fff;box-shadow:0 6px 0 #157a41;transition:transform .1s,filter .2s,box-shadow .1s}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #157a41}
.btn:disabled{background:#e4ebf2;color:#8a97a8;box-shadow:none;transform:none;filter:none}
.btn.ghost{margin-top:auto;background:transparent;border:2px solid var(--line);color:var(--ink);font-size:24px;padding:8px;box-shadow:none}
.done-note{font-size:28px;color:var(--s1t);font-weight:800;text-align:center}

/* end card (takes the info card's place in the panel) */
#endcard{display:none;flex:1;flex-direction:column;gap:12px;justify-content:center;background:var(--panel);border:3px solid var(--s3);border-radius:24px;padding:22px 28px;
  box-shadow:0 0 0 6px rgba(242,176,30,.18),0 12px 32px rgba(20,45,80,.14)}
.end #endcard{display:flex;animation:rise .6s cubic-bezier(.3,1.4,.5,1)}
.end #info{display:none}
.reveal #info{visibility:hidden}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
#endcard .grade{font-size:24px;color:var(--mute)}
#endcard .grade b{display:inline;font-size:40px;margin-right:12px;color:var(--s1t);line-height:1.1}
#endcard .ask{font-size:34px;font-weight:800;line-height:1.2;color:var(--s3t)}
#endcard .ask small{display:block;font-size:24px;color:var(--mute);font-weight:400;margin-top:6px}
#endcard .btn{font-size:26px;padding:10px}

/* overlays */
#attract{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.attract #attract{display:flex;background:linear-gradient(90deg,rgba(238,247,255,.94) 0,rgba(238,247,255,.74) 70%,rgba(238,247,255,.94))}
#attract .box{text-align:center;max-width:1300px}
#attract h1{font-size:120px;font-weight:800;line-height:1;letter-spacing:1px;color:var(--ink)}
#attract h1 em{font-style:normal;color:var(--s1t)}
#attract p{font-size:40px;color:#3b4756;margin:26px 0 54px}
#attract .go{font-size:52px;padding:22px 70px;border-radius:999px;animation:pulse .9s infinite alternate}
#attract .scopes{margin-top:54px;display:flex;justify-content:center;gap:22px;font-size:30px;font-weight:600}
#attract .scopes span{padding:8px 24px;border-radius:999px;border:2px solid var(--c);color:var(--c);background:#fff}
#attract .sound{margin-top:30px;font-size:26px;color:var(--mute)}
@keyframes pulse{to{transform:scale(1.06)}}
#banner{position:absolute;left:0;width:1300px;top:400px;text-align:center;font-size:96px;font-weight:800;pointer-events:none;opacity:0;transform:scale(.6);transition:.4s cubic-bezier(.3,1.6,.5,1);
  text-shadow:0 4px 0 #fff,0 -4px 0 #fff,4px 0 0 #fff,-4px 0 0 #fff,0 12px 30px rgba(20,45,80,.3)}
#banner.show{opacity:1;transform:none}
#banner.win{color:var(--s1t)}
#banner.wait{color:var(--s3t)}
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-30px;width:14px;height:24px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(1150px) rotate(720deg)}}
.float{position:absolute;font-size:56px;font-weight:800;color:var(--s1t);pointer-events:none;animation:floatup 1.2s ease-out forwards;
  text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff}
@keyframes floatup{to{transform:translateY(-110px);opacity:0}}
</style>
</head>
<body>
<div id="stage" class="attract">
  <div id="sky"></div>
  <header>
    <div class="brand"><span class="dot"></span><span data-i18n="title"></span></div>
    <div class="hud">
      <button class="pill" id="doneBtn" data-i18n="done"></button>
      <div class="pill" id="timePill">⏱ <b id="time">45</b></div>
      <div class="pill" id="budgetPill">💰 <b id="budget">70</b> <span data-i18n="coins"></span></div>
    </div>
    <button id="lang" title="TH / EN (L)"><span data-l="th">ไทย</span><span data-l="en">EN</span></button>
    <button id="mute" title="Sound (M)">🔊</button>
  </header>

  <svg id="scene" viewBox="0 0 1300 970">
    <defs><radialGradient id="sunG"><stop offset="0" stop-color="#fff6c2"/><stop offset=".35" stop-color="#ffd84d" stop-opacity=".9"/><stop offset="1" stop-color="#ffb81c" stop-opacity="0"/></radialGradient></defs>
    <g id="world"><g id="outer"></g><g id="sun"></g><g id="plant"></g><g id="pins"></g></g>
  </svg>
  <div id="narr"><svg viewBox="0 0 120 120" width="128" height="128" aria-hidden="true">
    <path d="M24 74 Q22 34 60 30 Q98 34 96 74 Q97 100 84 108 L36 108 Q23 100 24 74Z" fill="#3b2a22"/>
    <path d="M22 124 Q26 98 60 96 Q94 98 98 124Z" fill="#2f7de1"/>
    <rect x="52" y="82" width="16" height="17" rx="6" fill="#efbf96"/>
    <path d="M51 97 L60 107 L69 97Z" fill="#fff"/>
    <ellipse cx="60" cy="66" rx="25" ry="28" fill="#f8d2ac"/>
    <path d="M35 62 Q37 41 60 40 Q83 41 85 62 Q75 50 60 52 Q45 50 35 62Z" fill="#3b2a22"/>
    <path d="M27 48 Q29 18 60 16 Q91 18 93 48Z" fill="#ffc93c"/>
    <rect x="20" y="45" width="80" height="9" rx="4.5" fill="#f0a91a"/>
    <rect x="55" y="16" width="10" height="30" rx="4" fill="#ffdb70"/>
    <ellipse cx="50.5" cy="67" rx="3.4" ry="4.4" fill="#2a1d18"/><ellipse cx="69.5" cy="67" rx="3.4" ry="4.4" fill="#2a1d18"/>
    <circle cx="51.6" cy="65.6" r="1.1" fill="#fff"/><circle cx="70.6" cy="65.6" r="1.1" fill="#fff"/>
    <circle cx="43" cy="76" r="4.5" fill="#f49b9b" opacity=".55"/><circle cx="77" cy="76" r="4.5" fill="#f49b9b" opacity=".55"/>
    <ellipse class="mouth" cx="60" cy="81" rx="6.5" ry="3" fill="#b4473f"/>
  </svg></div>
  <div id="caption"><span id="capText"></span></div>

  <aside id="panel">
    <div class="card meter">
      <div class="lbl" data-i18n="meter"></div>
      <div class="goalTxt" data-i18n="goalTag"></div>
      <div class="num" id="total">100<small data-i18n="unit"></small></div>
      <div class="bar"><i id="bar"></i><div class="goal" id="goalMark"></div></div>
    </div>
    <div class="card" id="teaser">
      <div class="tz" id="tz2" style="--c:var(--s2);--ct:var(--s2)"><b>Scope 2</b><span class="qm">?</span><i>🔒 <span data-i18n="locked"></span></i></div>
      <div class="tz" id="tz3" style="--c:var(--s3);--ct:var(--s3t)"><b>Scope 3</b><span class="qm">?</span><i>🔒 <span data-i18n="locked"></span></i></div>
      <div class="hint" data-i18n="unlockHint"></div>
    </div>
    <div class="card" id="info"></div>
    <div id="endcard">
      <div class="grade"><b id="rank"></b><span id="cutLine"></span></div>
      <div class="ask"><span data-i18n="ask"></span><small data-i18n="askSub"></small></div>
      <button class="btn" id="againBtn" data-i18n="again"></button>
    </div>
  </aside>

  <div id="banner"></div>
  <div id="confetti"></div>

  <div id="attract">
    <div class="box">
      <h1 data-i18n="bigTitle"></h1>
      <p data-i18n="sub"></p>
      <button class="btn go" id="startBtn" data-i18n="start"></button>
      <div class="scopes">
        <span style="--c:var(--s1t)">Scope 1</span>
        <span style="--c:var(--s2)">Scope 2 ?</span>
        <span style="--c:var(--s3t)">Scope 3 ?</span>
      </div>
      <div class="sound" data-i18n="soundOn"></div>
    </div>
  </div>

</div>

<!-- Narrator script. Single source for captions AND the voice files (tools/make_voice.py reads this block).
     A value is either "text" or ["caption text", "how the voice should say it"]. -->
<script id="lines" type="application/json">
{
  "th": {
    "intro1": "สวัสดีค่ะ! โรงงานนี้กำลังปล่อยคาร์บอน ก๊าซที่มองไม่เห็น ที่ทำให้โลกร้อนขึ้น",
    "intro2": "ตัวเลขในป้ายสีแดง คือปริมาณคาร์บอนที่แต่ละเครื่องปล่อยออกมา",
    "intro3": "คลิกที่เครื่อง แล้วใช้เหรียญเพื่อแก้ไข แต่เหรียญมีจำกัด เลือกให้ดีนะคะ",
    "intro4": ["ลดคาร์บอนให้ต่ำกว่า 60 ภายใน 45 วินาที เริ่มเลย!", "ลดคาร์บอนให้ต่ำกว่าหกสิบ ภายในสี่สิบห้าวินาที เริ่มเลย!"],
    "src_boiler": "หม้อไอน้ำนี้เผาถ่านหินเพื่อทำไอน้ำ เป็นตัวปล่อยคาร์บอนที่ใหญ่ที่สุดในโรงงาน",
    "src_truck": "รถบรรทุกของบริษัท เผาน้ำมันดีเซลทุกเที่ยวที่วิ่ง",
    "src_ac": "แอร์มีสารทำความเย็นรั่วออกมา ซึ่งทำให้โลกร้อนแรงกว่าคาร์บอนหลายพันเท่า แต่แก้ได้ถูกมาก!",

/* ---------- state ---------- */
const S = {phase:'attract', lang:'th', muted:false, budget:BUDGET, time:PLAY_SECONDS, fixed:new Set(), sel:null, tick:null, timers:[], run:0, step:0, goalSaid:false};
try{ const l=localStorage.getItem('ftf-lang'); if(l==='en'||l==='th') S.lang=l; S.muted=localStorage.getItem('ftf-mute')==='1'; }catch(e){}
const $ = id => document.getElementById(id);
const stage = $('stage');
const L = () => T[S.lang];

/* ---------- stage fit ---------- */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- narrator ---------- */
const AUD = {}; let cur = null, capTimer = null;
const lineText = (id, lang=S.lang) => { const v = LINES[lang][id]; return Array.isArray(v) ? v[0] : v; };
function clip(id, lang=S.lang){
  const k = lang+'/'+id;
  // the offline build (tools/build_offline.py) embeds every clip in window.EMBED_AUDIO
  if(!AUD[k]){ AUD[k] = new Audio((window.EMBED_AUDIO||{})[k] || `audio/${k}.mp3`); AUD[k].preload = 'auto'; }
  return AUD[k];
}
function preload(){ Object.keys(LINES[S.lang]).forEach(id => clip(id)); }
function stopVoice(){ if(cur){ cur.pause(); cur = null; } clearTimeout(capTimer); $('caption').classList.remove('show'); $('narr').classList.remove('talk'); }
function say(id){
  const text = lineText(id); if(!text) return Promise.resolve();
  if(cur){ cur.pause(); }
  clearTimeout(capTimer);
  $('capText').textContent = text; $('caption').classList.add('show'); $('narr').classList.add('talk');
  const a = clip(id); cur = a; a.muted = S.muted;
  try{ a.currentTime = 0; }catch(e){}
  const est = 1500 + text.length * 75;           // fallback if audio cannot play
  return new Promise(res => {
    let done = false;
    const fin = () => {
      if(done) return; done = true; a.onended = null; clearTimeout(guard);
      if(cur === a){ $('narr').classList.remove('talk'); capTimer = setTimeout(()=>$('caption').classList.remove('show'), 1500); }
      res();
    };
    const guard = setTimeout(fin, est + 6000);
    a.onended = fin;
    a.onerror = () => setTimeout(fin, est);
    a.play().catch(() => setTimeout(fin, est));
  });
}

/* ---------- isometric drawing ---------- */
const TW=76, TH=38, CX=650, CY=205;
const P = (x,y,z=0) => [CX+(x-y)*TW/2, CY+(x+y)*TH/2 - z];
const pts = a => a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function box(x,y,w,d,h,c,st='',lift=0){
  const t=[P(x,y,h+lift),P(x+w,y,h+lift),P(x+w,y+d,h+lift),P(x,y+d,h+lift)];
  const r=[P(x+w,y,lift),P(x+w,y+d,lift),P(x+w,y+d,h+lift),P(x+w,y,h+lift)];
  const l=[P(x,y+d,lift),P(x+w,y+d,lift),P(x+w,y+d,h+lift),P(x,y+d,h+lift)];
  const s = st?` stroke="${st}" stroke-width="2.5" stroke-linejoin="round"`:'';
  return `<polygon points="${pts(l)}" fill="${c[1]}"${s}/><polygon points="${pts(r)}" fill="${c[2]}"${s}/><polygon points="${pts(t)}" fill="${c[0]}"${s}/>`;
}
function cyl(x,y,r,h,c,st=''){
  const [sx,sy]=P(x,y); const s = st?` stroke="${st}" stroke-width="2.5"`:'';
  return `<rect x="${sx-r}" y="${sy-h}" width="${r*2}" height="${h}" fill="${c[1]}"${s}/><ellipse cx="${sx}" cy="${sy}" rx="${r}" ry="${r/2}" fill="${c[1]}"${s}/><rect x="${sx-r+1}" y="${sy-h}" width="${r*2-2}" height="${h}" fill="${c[1]}"/><rect x="${sx}" y="${sy-h}" width="${r-1}" height="${h}" fill="${c[2]}"/><ellipse cx="${sx}" cy="${sy-h}" rx="${r}" ry="${r/2}" fill="${c[0]}"${s}/>`;
}
function puffs(x,y,z,n=3,col='#9aa6b4',big=1){
  const [sx,sy]=P(x,y,z); let o='';
  for(let i=0;i<n;i++) o+=`<circle class="puff" cx="${sx}" cy="${sy}" r="${14*big}" fill="${col}" style="animation-delay:${(i*2.4/n).toFixed(2)}s"/>`;
  return o;
}
const DARK=['#39434f','#222a33','#2c3540'];
const src = (id,inner) => `<g class="src" data-id="${id}">${inner}</g>`;

function buildPlant(){
  let g='';
  g+=`<polygon points="${pts([P(0,0),P(16,0),P(16,16),P(0,16)])}" fill="#dde3e8" stroke="var(--s1)" stroke-width="4" stroke-dasharray="18 12"/>`;
  g+=`<polygon points="${pts([P(0,16),P(16,16),P(16,16,-14),P(0,16,-14)])}" fill="#aeb8c2"/><polygon points="${pts([P(16,0),P(16,16),P(16,16,-14),P(16,0,-14)])}" fill="#bcc5ce"/>`;
  const [fx,fy]=P(1,16.6);
  g+=`<text id="fenceTxt" x="${fx}" y="${fy}" fill="var(--s1t)" font-size="24" font-weight="800" transform="rotate(26.57 ${fx} ${fy})"></text>`;
  g+=`<polygon points="${pts([P(8,10.5),P(16,10.5),P(16,15.5),P(8,15.5)])}" fill="#99a5b1"/>`;

  let w=`<polygon points="${pts([P(1,11),P(5.5,11),P(5.5,15.2),P(1,15.2)])}" fill="#3b4a2f" stroke="#58653e" stroke-width="5"/>`;
  [[2,12.2],[3.6,13.4],[2.4,14.3],[4.4,12]].forEach(([a,b],i)=>{const[sx,sy]=P(a,b);w+=`<circle class="bub" cx="${sx}" cy="${sy}" r="9" fill="#8fa65a" style="animation-delay:${i*.45}s"/>`});
  g+=src('water',w);

  // back to front: building (x<=9) is behind the boiler house (x>=10), so it is painted first
  g+=box(3,2.5,6,5.5,120,['#5c6f84','#34404e','#455467']);
  for(let i=0;i<4;i++){const a=P(3.6+i*1.4,8,85),b=P(4.6+i*1.4,8,85),c=P(4.6+i*1.4,8,55),d=P(3.6+i*1.4,8,55);g+=`<polygon points="${pts([a,b,c,d])}" fill="#ffd77a" opacity=".55"/>`}
  for(let i=0;i<3;i++) g+=box(3.5+i*1.9,3,1.2,4.5,12,['#6d8299','#3c4958','#4f6075'],'',120);

  g+=src('boiler', box(10,1.5,3,3,80,['#7a5a4c','#4f3a31','#634a3f']) + `<text x="${P(11.5,4.5,30)[0]}" y="${P(11.5,4.5,30)[1]}" font-size="24" text-anchor="middle">🔥</text>`
     + cyl(13.8,1.6,20,230,['#6b4f45','#4a3630','#5a423a']) + puffs(13.8,1.6,236,4,'#7d8794',1.5));   // chimney (x 13.8) stands in front of the house (x<=13)

  let ac='';
  for(let i=0;i<3;i++){ac+=box(2+i*1.35,9,1.1,1.1,30,['#9fb3c6','#5f7184','#7a8ea2']);const[sx,sy]=P(2.55+i*1.35,9.55,30);ac+=`<ellipse cx="${sx}" cy="${sy}" rx="17" ry="8.5" fill="#2b3642"/>`}
  [[2.3,9.6],[3.6,9.6],[5,9.6]].forEach(([a,b],i)=>{const[sx,sy]=P(a,b,36);ac+=`<circle class="puff" cx="${sx}" cy="${sy}" r="9" fill="#bfe3ff" style="animation-delay:${i*.7}s"/>`});
  g+=src('ac',ac);

  let lp=box(12.2,9.0,1.6,1.1,24,['#ffcc6a','#c58f22','#e0a83a']) + cyl(13.0,9.2,30,70,['#e9eef3','#aab4bf','#cfd7df']);
  const [lx,ly]=P(13.0,9.2,35); lp+=`<text x="${lx}" y="${ly}" font-size="22" font-weight="800" fill="#c0392b" text-anchor="middle">LPG</text>`;
  lp+=puffs(12.4,9.8,30,2,'#9aa6b4',.8);
  g+=src('lpg',lp);

  g+=src('gen', box(14.5,0.25,1.4,1.3,42,['#3f6f5a','#24453a','#2f5848']) + cyl(15.6,0.6,7,60,DARK) + puffs(15.6,0.6,64,3,'#6c7682',1));

  let tr='';
  [[9,11.4],[9,13.6]].forEach(([x,y])=>{
    tr+=box(x,y,3.1,1.4,52,['#e8edf2','#a9b3be','#c8d1da'])+box(x+3.1,y,1.2,1.4,40,['#ff6b5e','#b8382f','#d84a40']);
    tr+=puffs(x-.1,y+1.2,10,2,'#8b95a1',.9);
  });
  g+=src('truck',tr);
  $('plant').innerHTML=g;
  document.querySelectorAll('.src').forEach(el=>el.addEventListener('click',()=>select(el.dataset.id)));
}

const PIN_AT={boiler:[11.5,3,300],truck:[11.5,12.6,110],ac:[2.2,9.4,100],lpg:[13.0,9.2,110],water:[3.2,13.1,70],gen:[15.3,0.8,120]};

     `<g transform="translate(-236,-4)"><rect x="0" y="-25" width="156" height="46" rx="23" fill="#fff" stroke="#dbe3ec" stroke-width="2"/>`+

  $('pins').innerHTML=g;

}

function buildOuter(){
  const SL='#eef3f8', s2=['#d7ebfd','#b9d8f5','#c8e1f8'], s3=['#fdf1cf','#f1dca0','#f7e7b8'];
  let a='', b='';
  for(let x=-10;x<=-1;x+=3){const[p,q]=P(x,5);a+=`<polyline points="${p-14},${q} ${p},${q-90} ${p+14},${q}" fill="none" stroke="var(--s2)" stroke-width="4"/><line x1="${p-22}" y1="${q-70}" x2="${p+22}" y2="${q-70}" stroke="var(--s2)" stroke-width="4"/>`}
  const w1=P(-10,5,70),w2=P(-1,5,70); a+=`<line x1="${w1[0]}" y1="${w1[1]}" x2="${w2[0]}" y2="${w2[1]}" stroke="var(--s2)" stroke-width="3" stroke-dasharray="10 8"/>`;
  a+=box(-17,2,5,5,90,s2,'var(--s2)');
  [[-17.5,8.5],[-14.5,9.5]].forEach(([x,y])=>{const[sx,sy]=P(x,y);a+=`<path d="M${sx-46} ${sy} Q${sx-26} ${sy-90} ${sx-34} ${sy-170} L${sx+34} ${sy-170} Q${sx+26} ${sy-90} ${sx+46} ${sy}Z" fill="${SL}" stroke="var(--s2)" stroke-width="3"/>`});
  a+=lock(-15,6,330,'var(--s2)','q2');

  [[16,8,26,8],[8,0,8,-11],[8,16,8,26]].forEach(([p,q,r,s])=>{const p1=P(p,q),p2=P(r,s);b+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#b8c2cc" stroke-width="18" stroke-linecap="round"/>`});
  b+=box(2,-16,6,4,90,s3,'var(--s3)')+cyl(8.6,-15,14,170,s3,'var(--s3)');
  b+=lock(5,-14,300,'var(--s3)','q3','var(--s3t)');
  for(let i=0;i<3;i++)for(let j=0;j<2;j++)b+=box(20+j*3,3+i*3,2,2,40,s3,'var(--s3)');
  b+=lockSmall(22.5,7,140);
  const[hx,hy]=P(26,19);b+=`<path d="M${hx-150} ${hy-40} L${hx+150} ${hy-40} L${hx+110} ${hy+20} L${hx-120} ${hy+20}Z" fill="${SL}" stroke="var(--s3)" stroke-width="3"/>`;
  for(let i=0;i<4;i++)b+=`<rect x="${hx-110+i*52}" y="${hy-90}" width="46" height="50" fill="#fdf1cf" stroke="var(--s3)" stroke-width="2.5"/>`;
  b+=lockSmall(26,19,150);
  const[mx,my]=P(4,27);b+=`<path d="M${mx-170} ${my} Q${mx} ${my-170} ${mx+170} ${my}Z" fill="${SL}" stroke="var(--s3)" stroke-width="3"/>`;
  b+=lockSmall(4,27,170);
  b+=box(16,22,4,3,60,s3,'var(--s3)')+lockSmall(18,23.5,140);
  $('outer').innerHTML=`<g id="o3">${b}</g><g id="o2">${a}</g>`;
}
function lock(x,y,z,c,q,tc=c){
  const[sx,sy]=P(x,y,z);
  return `<g transform="translate(${sx},${sy})"><g class="lockq"><circle r="70" fill="${c}"/><text y="34" text-anchor="middle" font-size="100" font-weight="800" fill="#0a0e13">?</text></g><text id="${q}" class="q" y="-100" ${q==='q2'?'x="-150" text-anchor="start"':'text-anchor="middle"'} font-size="52" fill="${tc}" stroke="#fff" stroke-width="10" paint-order="stroke"></text></g>`;
}
function lockSmall(x,y,z){const[sx,sy]=P(x,y,z);return `<g transform="translate(${sx},${sy})"><g class="lockq"><circle r="44" fill="var(--s3)"/><text y="22" text-anchor="middle" font-size="64" font-weight="800" fill="#0a0e13">?</text></g></g>`}

/* smoggy sky behind the factory: thick at 100, clear near the goal; sun shows once below the goal */
function buildSky(){
  const banks=[[200,230,420,190],[520,165,470,200],[840,160,470,200],[1100,265,330,170],[110,420,300,150],[380,360,330,150],[1040,420,260,130]];
  $('sky').innerHTML=banks.map(([x,y,w,h],i)=>`<i style="left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;animation-delay:${-i*1.7}s;animation-duration:${9+i%3*2}s"></i>`).join('');
  const rays=[...Array(12)].map((_,i)=>`<rect x="-6" y="-150" width="12" height="44" rx="6" fill="#ffd84d" transform="rotate(${i*30})"/>`).join('');
  $('sun').innerHTML=`<g transform="translate(200,170)"><circle r="170" fill="url(#sunG)"/><g class="rays">${rays}</g><circle r="70" fill="#ffe27a"/></g>`;
}

/* ---------- panel ---------- */
function buildBoard(){
  $('goalMark').style.left=(GOAL/BASE*100)+'%';
}

function howHTML(){
  const t=L();
  return `<h3>📋 ${t.how}</h3><div class="how">${[1,2,3].map(i=>`<div class="${S.step===i?'on':''}"><b>${i}</b>${t['st'+i]}</div>`).join('')}</div>`;
}
// Rebuild the card only when its content changes: a rebuild between mouse-down and mouse-up swaps
// the button out and the click is lost (the clock used to rebuild it every second).
function setInfo(html, bind){
  const el=$('info'); if(el._html===html) return;
  el._html=html; el.innerHTML=html; if(bind) bind();
}
function renderInfo(){
  const t=L();
  if(S.phase==='intro') return setInfo(howHTML()+`<button class="btn ghost" id="skipBtn">${t.skip}</button>`, ()=>$('skipBtn').onclick=skipIntro);
  if(S.phase!=='play') return setInfo('');
  if(!S.sel) return setInfo(howHTML());
  const s=SRC.find(x=>x.id===S.sel), [name,desc,fixTxt]=t.src[s.id], f=S.fixed.has(s.id), can=S.budget>=s.cost;
  setInfo(`<h3><span>${s.icon}</span>${name}</h3><div class="desc">${desc}</div>
    <div class="emit">${t.emits} <b>${f?s.e-s.cut:s.e}</b> ${t.unit}</div>
    <div class="fix"><div class="t">${t.fixLbl}: ${fixTxt}</div><div class="stats"><span class="cut">${t.cut} −${s.cut}</span><span class="cost">💰 ${s.cost} ${t.coins}</span></div>
    ${f?`<div class="done-note">${t.fixed}</div>`:`<button class="btn" id="fixBtn" ${can?'':'disabled'}>${can?t.fixIt(s.cost):t.noMoney}</button>`}</div>`,
    ()=>{ const fb=$('fixBtn'); if(fb) fb.onclick=()=>fix(s.id); });
}

const total=()=>SRC.reduce((a,s)=>a+(S.fixed.has(s.id)?s.e-s.cut:s.e),0);
const pct=()=>Math.round((BASE-total())/BASE*100);
function renderTime(){ $('time').textContent=S.time; $('timePill').classList.toggle('low',S.phase==='play'&&S.time<=10); }
function render(){
  const tot=total();
  $('budget').textContent=S.budget;
  renderTime();
  const n=$('total'); n.firstChild.nodeValue=tot; n.classList.toggle('good',tot<GOAL);
  $('bar').style.width=(tot/BASE*100)+'%';
  SRC.forEach(s=>{
    const f=S.fixed.has(s.id), v=f?s.e-s.cut:s.e, col=f?'var(--s1)':'var(--red)';
    const p=$('pin-'+s.id); p.querySelector('rect').setAttribute('fill',col); p.querySelector('path').setAttribute('fill',col);
    const tag=p.querySelector('.tag'); tag.textContent=(f?'✔ ':'')+v; tag.setAttribute('fill','#fff');
    const g=document.querySelector(`.src[data-id="${s.id}"]`); g.classList.toggle('fixed',f); g.classList.toggle('sel',S.sel===s.id);
  });
  $('hand').classList.toggle('on', S.phase==='play' && !S.sel && S.fixed.size===0);
  $('sky').style.opacity = Math.max(0, Math.min(1, (tot-50)/50)).toFixed(2);
  $('sun').classList.toggle('on', tot<GOAL);
  $('mute').textContent = S.muted ? '🔇' : '🔊';
  renderInfo();
}

function applyLang(){
  const t=L(); document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t[el.dataset.i18n]);
  document.querySelectorAll('#lang span').forEach(s=>s.classList.toggle('on',s.dataset.l===S.lang));
  $('fenceTxt').textContent=t.fence; $('q2').textContent=t.q2; $('q3').textContent=t.q3; $('handTxt').textContent=t.click;
  if(S.phase==='end') fillEnd();
  preload(); render();
}

/* ---------- game flow ---------- */
function setPhase(p){ S.phase=p; ['attract','intro','play','reveal','end'].forEach(c=>stage.classList.toggle(c,c===p)); }
const hl = v => stage.dataset.hl = v;
function later(fn,ms){ S.timers.push(setTimeout(fn,ms)); }

const INTRO = [['intro1',0,''],['intro2',1,'pins'],['intro3',2,'budget'],['intro4',3,'meter']];
async function startGame(){
  reset(true); preload();
  const run=++S.run; setPhase('intro'); render();
  for(const [id,step,h] of INTRO){
    S.step=step; hl(h); render();
    await say(id);
    if(run!==S.run) return;
  }
  beginPlay();
}
function skipIntro(){ if(S.phase!=='intro') return; stopVoice(); beginPlay(); }
function beginPlay(){
  S.run++; S.step=0; hl(''); setPhase('play'); render();
  S.tick=setInterval(()=>{
    S.time--; renderTime();
    if(S.time===10) say('time10');
    if(S.time<=0) endGame();
  },1000);
}

function select(id){ if(S.phase!=='play') return; S.sel=id; render(); say('src_'+id); }
function fix(id){
  const s=SRC.find(x=>x.id===id); if(S.phase!=='play'||S.fixed.has(id)||S.budget<s.cost) return;
  S.budget-=s.cost; S.fixed.add(id); render();
  floatText(id,'−'+s.cut);
  if(!S.goalSaid && total()<GOAL){ S.goalSaid=true; say('goal'); } else say('ok'+(1+Math.floor(Math.random()*3)));
  const left=SRC.filter(x=>!S.fixed.has(x.id));
  if(!left.length||left.every(x=>x.cost>S.budget)) later(endGame,2200);
}
function floatText(id,txt){
  const r=$('pin-'+id).getBoundingClientRect(), sr=stage.getBoundingClientRect(), k=sr.width/1920;
  const d=document.createElement('div'); d.className='float'; d.textContent=txt;
  d.style.left=((r.left-sr.left)/k)+'px'; d.style.top=((r.top-sr.top)/k-40)+'px';
  stage.appendChild(d); setTimeout(()=>d.remove(),1300);
}

async function endGame(){
  if(S.phase!=='play') return;
  clearInterval(S.tick); S.sel=null; setPhase('reveal'); render();
  const run=++S.run, ok=()=>run===S.run, p=pct(), b=$('banner');
  b.className='show win'; b.textContent=p>0?L().win(p):L().none;
  if(p>0) confetti();
  await say(p>0?'win':'none'); if(!ok()) return;
  b.className='show wait'; b.textContent=L().wait;
  stage.classList.add('zoom'); $('panel').classList.add('tease');
  later(()=>b.className='',1800);
  await say('reveal'); if(!ok()) return;
  hl('s2'); await say('s2'); if(!ok()) return;
  hl('s3'); await say('s3'); if(!ok()) return;
  hl(''); setPhase('end'); fillEnd();
  await say('end'); if(!ok()) return;
  later(()=>reset(),30000);
}
function fillEnd(){
  const p=pct(), r=L().ranks; $('rank').textContent=r[total()<GOAL?2:p>=25?1:0]; $('cutLine').textContent=L().cutLine(p);
}
function reset(silent){
  S.run++; stopVoice(); clearInterval(S.tick); S.timers.forEach(clearTimeout); S.timers=[];
  Object.assign(S,{budget:BUDGET,time:PLAY_SECONDS,sel:null,step:0,goalSaid:false}); S.fixed=new Set();
  stage.classList.remove('zoom'); $('panel').classList.remove('tease'); $('banner').className=''; $('confetti').innerHTML=''; hl('');
  if(!silent) setPhase('attract');
  render();
}
function confetti(){
  const c=$('confetti'), cols=['#3ddc84','#3aa8ff','#ffc93c','#ff4d5e','#fff'];
  for(let i=0;i<120;i++){const e=document.createElement('i');e.style.left=Math.random()*1300+'px';e.style.background=cols[i%5];
    e.style.animationDuration=(1.6+Math.random()*1.6)+'s';e.style.animationDelay=Math.random()*.5+'s';c.appendChild(e)}
}

/* ---------- input ---------- */
function toggleMute(){ S.muted=!S.muted; if(cur) cur.muted=S.muted; try{localStorage.setItem('ftf-mute',S.muted?'1':'0')}catch(e){} render(); }
$('startBtn').onclick=startGame;
$('doneBtn').onclick=()=>endGame();
$('againBtn').onclick=startGame;
$('attract').addEventListener('click',e=>{ if(e.target.id!=='startBtn') startGame(); });
$('lang').onclick=()=>{ S.lang=S.lang==='th'?'en':'th'; try{localStorage.setItem('ftf-lang',S.lang)}catch(e){} applyLang(); };
$('mute').onclick=toggleMute;
addEventListener('keydown',e=>{               // staff shortcuts
  const k=e.key.toLowerCase();
  if(k==='r') reset();
  if(k==='l') $('lang').click();
  if(k==='m') toggleMute();
  if(k==='f') document.documentElement.requestFullscreen?.();
});

buildPlant(); buildSky(); buildPins(); buildOuter(); buildBoard(); applyLang();
</script>
</body>
</html>
